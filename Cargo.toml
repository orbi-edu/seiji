[package]
name = "seiji"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted, budgeted iOS simulator and Android emulator pool for AI agents, served over MCP and driven by Maestro"
license = "MIT"
repository = "https://github.com/wiljafor1/seiji"
readme = "README.md"
keywords = ["mcp", "ios-simulator", "android-emulator", "maestro", "ai-agents"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
hex = "0.4.3"
rmcp = { version = "3.10.0", features = ["client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
