<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" role="img" aria-labelledby="t">
  <title id="t">seiji: iOS simulators, conducted</title>
  <defs>
    <linearGradient id="baton" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C98A45"/>
      <stop offset="1" stop-color="#F6D7A0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E3D8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#E9E3D8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E9E3D8" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <!-- Stage -->
  <rect width="256" height="256" rx="56" fill="#16161B"/>
  <!-- The conductor's sweep: a brush stroke that rises over the device -->
  <path d="M30 170 C 34 92, 104 34, 214 40 C 118 48, 62 98, 44 176 Z" fill="url(#sweep)"/>
  <!-- Device -->
  <rect x="92" y="70" width="104" height="160" rx="24" fill="#1F1F26" stroke="#E9E3D8" stroke-width="9"/>
  <rect x="127" y="84" width="34" height="9" rx="4.5" fill="#E9E3D8"/>
  <!-- The beat lands: a tap -->
  <circle cx="152" cy="152" r="28" fill="none" stroke="#F0C27A" stroke-opacity=".25" stroke-width="5"/>
  <circle cx="152" cy="152" r="16" fill="none" stroke="#F0C27A" stroke-opacity=".55" stroke-width="5"/>
  <!-- Baton: tapered shaft and cork grip -->
  <polygon points="58,229 152.8,153 151.2,151 50,219" fill="url(#baton)"/>
  <ellipse cx="45" cy="232" rx="17" ry="10" transform="rotate(-38 45 232)" fill="#8C5222"/>
  <circle cx="152" cy="152" r="6.5" fill="#FBEBCB"/>
  <text x="292" y="150" font-family="'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="128" font-weight="600" letter-spacing="-2" fill="#EDE7DC">seiji</text>
  <text x="298" y="204" font-family="'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="1" fill="#A9A39A">iOS simulators, conducted</text>
</svg>
